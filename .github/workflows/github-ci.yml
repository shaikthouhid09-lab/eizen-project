name: CI-CD Pipeline (EKS + ECR)

on:
  push:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO_NAME: flask-nginx-app
  EKS_CLUSTER: flask-eks-cluster
  K8S_NAMESPACE: flask-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using IAM Role (OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::099210689252:role/github-actions-eks-role
          aws-region: ap-south-1

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Detect environment and set image tags
      - name: Detect environment and set variables
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "FLASK_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:flask-${IMAGE_TAG}" >> $GITHUB_ENV
          echo "NGINX_IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:nginx-${IMAGE_TAG}" >> $GITHUB_ENV

      # 6. Build Flask Docker image
      - name: Build Flask Docker image
        run: |
          docker build \
            -t $FLASK_IMAGE \
            -f task2-docker-compose/Dockerfile \
            task2-docker-compose

      # 7. Build Nginx Docker image
      - name: Build Nginx Docker image
        run: |
          docker build \
            -t $NGINX_IMAGE \
            -f task2-docker-compose/nginx.Dockerfile \
            task2-docker-compose

      # 8. Push Docker images to ECR
      - name: Push images to ECR
        run: |
          docker push $FLASK_IMAGE
          docker push $NGINX_IMAGE

      # 9. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      # 10. Verify EKS access
      - name: Verify EKS access
        run: kubectl get nodes

      # 11. Create namespace and apply RBAC
      - name: Create namespace and apply RBAC
        run: |
          kubectl get namespace $K8S_NAMESPACE || kubectl create namespace $K8S_NAMESPACE
          kubectl apply -f task4-terraform-eks/k8s/01-configmap.yaml
          kubectl apply -f task4-terraform-eks/k8s/04-rbac.yaml

      # 12. Create / update ECR image pull secret
      - name: Create ECR pull secret
        run: |
          kubectl create secret docker-registry ecr-secret \
            --docker-server=$ECR_REGISTRY \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region $AWS_REGION) \
            -n $K8S_NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -

      # 13. Update Kubernetes manifests with new image tags
      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: .*flask-.*|image: $FLASK_IMAGE|g" task4-terraform-eks/k8s/02-flask-app-deployment.yaml
          sed -i "s|image: .*nginx-.*|image: $NGINX_IMAGE|g" task4-terraform-eks/k8s/03-nginx-proxy-deployment.yaml

      # 14. Deploy applications to EKS
      - name: Deploy applications
        run: |
          kubectl apply -f task4-terraform-eks/k8s/02-flask-app-deployment.yaml
          kubectl apply -f task4-terraform-eks/k8s/03-nginx-proxy-deployment.yaml

      # 15. Apply Network Policies and HPA
      - name: Apply Network Policies and HPA
        run: |
          kubectl apply -f task4-terraform-eks/k8s/05-network-policy.yaml
          kubectl apply -f task4-terraform-eks/k8s/06-hpa-pdb.yaml

      # 16. Deploy Prometheus monitoring
      - name: Deploy Prometheus
        run: kubectl apply -f task4-terraform-eks/k8s/07-prometheus.yaml

      # 17. Verify deployment
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/flask-app -n $K8S_NAMESPACE --timeout=5m
          kubectl rollout status deployment/nginx-proxy -n $K8S_NAMESPACE --timeout=5m
          kubectl get pods -n $K8S_NAMESPACE
          kubectl get svc -n $K8S_NAMESPACE

